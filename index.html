<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AluPro</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7fb;--bg2:#e6edf7;--card:rgba(255,255,255,.85);--text:#12233d;--muted:#6b7a92;--a1:#2563eb;--a2:#06b6d4;--line:rgba(18,35,61,.1);--ok:#16a34a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;background-image:radial-gradient(circle at 15% 0%,var(--a1) -40%,transparent 45%),radial-gradient(circle at 100% 20%,var(--a2) -50%,transparent 45%);background-attachment:fixed;transition:.4s}
:root[data-theme=ocean]{--bg:#071429;--card:rgba(255,255,255,.07);--text:#eaf2ff;--muted:#8fa5c8;--a1:#3b82f6;--a2:#22d3ee;--line:rgba(255,255,255,.12);color-scheme:dark}
:root[data-theme=gold]{--bg:#120f08;--card:rgba(255,215,120,.07);--text:#fff5dc;--muted:#b9a577;--a1:#f5b301;--a2:#ff7a18;--line:rgba(255,215,120,.16);color-scheme:dark}
:root[data-theme=emerald]{--bg:#06150f;--card:rgba(255,255,255,.07);--text:#e6fff4;--muted:#86b9a2;--a1:#10b981;--a2:#84cc16;--line:rgba(255,255,255,.12);color-scheme:dark}
:root[data-theme=royal]{--bg:#120a24;--card:rgba(255,255,255,.07);--text:#f3ecff;--muted:#b09ad6;--a1:#8b5cf6;--a2:#ec4899;--line:rgba(255,255,255,.12);color-scheme:dark}
:root[data-theme=sunset]{--bg:#1c0b10;--card:rgba(255,255,255,.07);--text:#fff0ea;--muted:#d1a094;--a1:#f43f5e;--a2:#fb923c;--line:rgba(255,255,255,.12);color-scheme:dark}
:root[data-theme=clean]{color-scheme:light}
.app{max-width:560px;margin:0 auto;padding:18px 16px 110px}
.hero{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.hero h1{font-size:22px;margin:0;font-weight:700}
.hero p{margin:2px 0 0;color:var(--muted);font-size:13px}
.note{background:rgba(245,179,1,.15);border:1px solid rgba(245,179,1,.45);border-radius:12px;padding:10px;font-size:12px;margin:8px 0}
.log{font-size:12px;color:var(--muted);padding:3px 0}
#prn{position:fixed;inset:0;z-index:200;background:#fff;color:#000;overflow:auto;display:none;padding:12px;font-family:Poppins,system-ui,sans-serif}
#prn .bar{display:flex;gap:8px;margin-bottom:12px;align-items:center}
#prn .bar select{width:auto;background:#fff;color:#000}
.pa4{max-width:780px;margin:0 auto;font-size:13px}.pa4 h1{margin:0;font-size:22px}.pa4 table{width:100%;border-collapse:collapse;margin:12px 0}.pa4 th,.pa4 td{border-bottom:1px solid #ccc;padding:6px;text-align:left}.pa4 .r{text-align:right}.pa4 .tt{width:55%;margin-left:auto}.pa4 .b td{font-weight:700}.pa4 .sm{font-size:11px;color:#555}.pa4 .sig{display:flex;justify-content:space-between;margin-top:50px}.pa4 .sig span{border-top:1px solid #000;padding-top:4px;width:40%;text-align:center}
.prc{width:72mm;margin:0 auto;font:12px/1.4 ui-monospace,Menlo,monospace}.prc .c{text-align:center}.prc .big{font-size:15px}.prc .b{font-weight:700}.prc .rw{display:flex;justify-content:space-between}.prc .dl{border-top:1px dashed #000;margin:5px 0}
@media print{body>*:not(#prn){display:none!important}body{background:#fff!important}#prn{position:static;overflow:visible;padding:0}.noprint{display:none!important}}
.plan{border:2px solid var(--line);border-radius:18px;padding:14px;cursor:pointer;margin-bottom:10px}.plan.on{border-color:var(--a1)}.pbar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:8px}.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--a1),var(--a2))}
.nav{overflow-x:auto;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}#nav button{flex:1 0 auto;min-width:56px}
#auth{position:fixed;inset:0;z-index:100;overflow:auto;background:var(--bg);background-image:radial-gradient(circle at 15% 0%,var(--a1) -40%,transparent 45%),radial-gradient(circle at 100% 20%,var(--a2) -50%,transparent 45%)}
#auth a{color:var(--a2);cursor:pointer;text-decoration:underline}
#nav button{font-size:9.5px;padding:7px 0}#nav .e{font-size:17px}.bd{background:#f43f5e;color:#fff;border-radius:9px;padding:0 5px;font-size:9px;font-style:normal;margin-left:2px}
@media(max-width:430px){.logo{display:none}}
.tsel{width:auto;padding:9px 10px;font-size:12px;border-radius:14px}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--a1),var(--a2));display:grid;place-items:center;box-shadow:0 8px 24px -6px var(--a1)}
.logo svg{width:24px;height:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px -18px rgba(0,0,0,.4)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stat{border-radius:20px;padding:16px;color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 14px 28px -14px var(--a1)}
.stat.alt{background:var(--card);color:var(--text);border:1px solid var(--line)}
.stat small{opacity:.8;font-size:12px}.stat b{display:block;font-size:22px;margin-top:4px}
h2{font-size:16px;margin:18px 2px 10px}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px;background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted);font-size:12px}
.steps{display:flex;gap:4px;margin:12px 0 4px}
.steps i{flex:1;height:6px;border-radius:9px;background:var(--line)}
.steps i.on{background:linear-gradient(90deg,var(--a1),var(--a2))}
button,select,input{font:inherit;color:var(--text)}
.btn{border:0;border-radius:14px;padding:11px 16px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2));cursor:pointer;box-shadow:0 10px 20px -10px var(--a1)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);box-shadow:none}
.btn.full{width:100%;margin-top:10px}
input,select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);outline:none}
select option{color:#12233d}
input:focus,select:focus{border-color:var(--a1)}
label{font-size:12px;color:var(--muted);display:block;margin:10px 0 4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chip{padding:7px 12px;border-radius:99px;border:1px solid var(--line);font-size:12px;cursor:pointer;background:var(--card)}
.chip.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;border-color:transparent}
.line{display:flex;justify-content:space-between;font-size:13px;padding:5px 0}
.total{font-weight:700;font-size:18px;border-top:1px dashed var(--line);margin-top:6px;padding-top:10px}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.th{border-radius:18px;padding:14px;border:2px solid transparent;cursor:pointer;color:#fff;min-height:92px;display:flex;flex-direction:column;justify-content:flex-end;font-weight:600;transition:.2s}
.th:active{transform:scale(.97)}.th.on{border-color:#fff;box-shadow:0 0 0 3px var(--a1)}
.nav{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;display:flex;padding:8px;border-radius:24px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 20px 40px -12px rgba(0,0,0,.5)}
.nav button{flex:1;border:0;background:none;padding:8px 2px;border-radius:16px;font-size:11px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button .e{font-size:20px}.nav button.on{color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2))}
.fade{animation:f .35s ease}@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
</style>
</head>
<body>
<div class="app">
  <div class="hero"><div><h1 id="ttl">AluPro</h1><p id="sub">Aluminium &amp; Glass Workshop</p></div><div style="display:flex;gap:6px;align-items:center"><select id="rsel" style="display:none" class="tsel" onchange="demoRole(this.value)" aria-label="Role"><option value="admin">👑 Admin</option><option value="dealer">🏭 Dealer</option><option value="vendor" selected>🏪 Vendor</option><option value="client">👤 Client</option></select><select id="tsel" class="tsel" onchange="setTheme(this.value)" aria-label="Theme"></select><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 3v18M3 12h18"/></svg></div></div></div>
  <div id="view" class="fade"></div>
</div>
<div id="prn"></div>
<div id="auth" style="display:none"></div>
<div class="nav" id="nav"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const C_ADM="alupro_admin_c1";let C_sb,C_uid,C_prof,C_plans,C_admin=false,C_client=false,C_noKV=false,C_snap={};const C_pend=new Set();
const KV={m:{},timers:{},getItem(k){return Object.prototype.hasOwnProperty.call(this.m,k)?this.m[k]:null},setItem(k,v){this.m[k]=String(v);C_sched(k)},removeItem(k){delete this.m[k];C_sched(k,true)}};
function C_sync(t){const e=document.getElementById("sync");if(e)e.textContent=t}
function C_sched(k,del){if(C_noKV)return;if(C_admin){if(k===C_ADM){clearTimeout(KV.timers[k]);KV.timers[k]=setTimeout(C_syncAdmin,600)}return}
if(k.indexOf("_c1")<0&&k!=="alutheme")return;if(/orders_c1|clients_c1|prod_c1/.test(k))C_mirrorSoon();C_pend.add(k);C_sync("☁ Saving…");clearTimeout(KV.timers[k]);KV.timers[k]=setTimeout(()=>C_push(k,del),700)}
async function C_push(k,del){try{const r=del?await C_sb.from("kv").delete().eq("owner",C_uid).eq("key",k):await C_sb.from("kv").upsert({owner:C_uid,key:k,value:(/orders_c1/.test(k)?C_wT(KV.m[k]):KV.m[k]),updated_at:new Date().toISOString()});if(r.error)throw r.error;C_pend.delete(k);if(!C_pend.size)C_sync("☁ Saved");if(/orders_c1|clients_c1/.test(k)){clearTimeout(KV.timers.stats);KV.timers.stats=setTimeout(C_stats,1500)}}catch(e){C_sync("⚠ Save nahi hua. Internet check karein");setTimeout(()=>C_sched(k,del),6000)}}
function C_len(k){try{return JSON.parse(KV.m[k]||"[]").length}catch(e){return 0}}
function C_stats(){C_sb.rpc("update_my_stats",{p_orders:C_len("alupro_orders_c1"),p_clients:C_len("alupro_clients_c1")})}
const C_map=p=>({id:p.id,kind:p.kind||"vendor",shop:p.shop||"(naam nahi diya)",owner:p.owner||"",phone:p.phone||"",email:p.email||"",joined:p.joined,plan:p.plan,expiry:p.expiry,pending:p.pending,suspended:!!p.suspended,verified:!!p.verified,pays:p.pays||[],orders:p.orders||0,clients:p.clients||0});
const C_sj=v=>JSON.stringify([v.plan,v.expiry,v.pending,v.pays,!!v.suspended,!!v.verified]);
async function C_syncAdmin(){try{const S=JSON.parse(KV.m[C_ADM]);C_sync("☁ Saving…");const sr=await C_sb.from("app_settings").upsert({key:"plans",value:S.set});if(sr.error)throw sr.error;
for(const v of S.vendors){const j=C_sj(v);if(C_snap[v.id]===j)continue;const r=await C_sb.from("profiles").update({plan:v.plan,expiry:v.expiry,pending:v.pending,pays:v.pays,suspended:!!v.suspended,verified:!!v.verified}).eq("id",v.id);if(r.error)throw r.error;C_snap[v.id]=j}C_sync("☁ Saved")}catch(e){C_sync("⚠ Save nahi hua: "+(e.message||e))}}
function C_box(inner){const a=document.getElementById("auth");a.style.display="block";a.innerHTML=`<div class="app" style="padding-top:48px"><div class="logo" style="margin:0 auto 12px;display:grid;font-size:24px">🪟</div><h1 style="text-align:center;margin:0">AluPro</h1><p class="muted" style="text-align:center">Aluminium &amp; Glass Workshop</p><div class="card">${inner}</div></div>`}
function C_msg(t,x,lo){C_box(`<b>${t}</b><p class="muted">${x}</p>${lo?`<button class="btn ghost full" onclick="C_out()">Logout</button>`:""}`)}
function C_esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]))}
function C_login(info){C_box(`<b>Login</b>${info?`<div class="note"><b>${C_esc(info.shop||"Workshop")}</b> ne aap (${C_esc(info.cname||"")}) ko invite kiya hai. Apne orders dekhne ke liye Google se login karein.</div>`:`<p class="muted">Apne Google account se sign in karein.</p>`}<button class="btn full" style="background:#fff;color:#222;display:flex;align-items:center;justify-content:center;gap:10px" onclick="C_google()"><b style="font-size:18px;color:#4285F4">G</b> Continue with Google</button><div id="am" class="note" style="display:none"></div>`)}
async function C_google(){const r=await C_sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+location.pathname}});if(r.error){const e=document.getElementById("am");e.style.display="block";e.textContent=r.error.message}}
function C_out(){C_sb.auth.signOut().then(()=>location.reload())}
function C_kind(k){window._kind=k;document.getElementById("kv").className="chip"+(k==="vendor"?" on":"");document.getElementById("kd").className="chip"+(k==="dealer"?" on":"")}
function C_setup(){window._kind="vendor";C_box(`<b>Aap kaun hain?</b><div class="chips" style="margin:8px 0"><span class="chip on" id="kv" onclick="C_kind('vendor')">🏪 Workshop (Vendor)</span><span class="chip" id="kd" onclick="C_kind('dealer')">🏭 Dealer (Aluminium bechne wala)</span></div><label>Shop / Dealer ka naam</label><input id="ssn"><label>Aap ka naam</label><input id="sno"><label>Phone</label><input id="ssp" type="tel"><button class="btn full" onclick="C_saveSetup()">Start</button><div id="am" class="note" style="display:none"></div>`)}
async function C_saveSetup(){const g=i=>document.getElementById(i).value.trim(),e=document.getElementById("am");if(!g("ssn")||!g("sno")){e.style.display="block";e.textContent="Shop name aur apna naam likhein.";return}const r=await C_sb.rpc("update_my_profile",{p_shop:g("ssn"),p_owner:g("sno"),p_phone:g("ssp"),p_kind:window._kind||"vendor"});if(r.error){e.style.display="block";e.textContent=r.error.message;return}await C_refresh();C_start()}
async function C_refresh(){const x=await C_sb.from("profiles").select("*").eq("id",C_uid).maybeSingle();if(x.data)C_prof=x.data}
async function C_check(){await C_refresh();location.reload()}
async function C_main(){
if(!window.SUPABASE_URL||/PASTE/.test(window.SUPABASE_URL)){C_msg("Setup baqi hai","config.js mein Supabase URL aur anon key paste karein (SETUP.md dekhein).");return}
if(!window.supabase){C_msg("Supabase library load nahi hui","Internet check karein aur page reload karein.");return}
C_sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
const inv=new URLSearchParams(location.search).get("invite");if(inv)localStorage.setItem("alupro_invite",inv);
const r=await C_sb.auth.getSession();
if(!r.data.session){const code=localStorage.getItem("alupro_invite");let info=null;if(code){const x=await C_sb.rpc("invite_info",{p_code:code});info=x.data&&x.data[0]}C_login(info);return}
C_uid=r.data.session.user.id;let p=null;for(let i=0;i<6&&!p;i++){const x=await C_sb.from("profiles").select("*").eq("id",C_uid).maybeSingle();p=x.data;if(!p)await new Promise(z=>setTimeout(z,700))}
if(!p){C_msg("Profile nahi mili","schema.sql sahi chali ya nahi check karein, phir logout karke dobara login karein.",true);return}
C_prof=p;const code=localStorage.getItem("alupro_invite");
if(code){const x=await C_sb.rpc("claim_invite",{p_code:code});localStorage.removeItem("alupro_invite");try{history.replaceState(null,"",location.pathname)}catch(e){}if(x.error){C_msg("Invite nahi chala",C_esc(x.error.message),true);return}await C_refresh()}
p=C_prof;C_admin=p.role==="admin";C_client=!C_admin&&p.kind==="client";
const s=await C_sb.from("app_settings").select("value").eq("key","plans").maybeSingle();C_plans=(s.data&&s.data.value)||{host:25,fee:25,yr:10,trial:30,pay:""};
if(C_client){C_startClient();return}
if(!C_admin&&!p.shop){C_setup();return}C_start()}
function C_inject(){for(const id of ["appsrc","gluesrc"]){const sc=document.createElement("script");sc.textContent=document.getElementById(id).textContent;document.body.appendChild(sc)}}
async function C_start(){
if(C_admin){const L=await C_sb.from("profiles").select("*").neq("role","admin").neq("kind","client").order("created_at",{ascending:false}),vs=(L.data||[]).map(C_map);vs.forEach(v=>C_snap[v.id]=C_sj(v));KV.m[C_ADM]=JSON.stringify({set:C_plans,vendors:vs});KV.m["alupro_vendor_c1"]=JSON.stringify({shop:"AluPro Admin",name:C_prof.owner||C_prof.email,email:C_prof.email,phone:""})}
else{const q=await C_sb.from("kv").select("key,value").eq("owner",C_uid);(q.data||[]).forEach(r=>KV.m[r.key]=r.value);KV.m["alupro_vendor_c1"]=JSON.stringify({shop:C_prof.shop,name:C_prof.owner,email:C_prof.email,phone:C_prof.phone||""});KV.m["alupro_sess_c1"]=JSON.stringify({role:"vendor",phone:""})}
C_inject();CLOUDSTART()}
let C_vend=null,C_links=[],C_mirRow={orders:[],credit:0},C_vprods=[],C_acts=[],C_vinfo={shop:"Vendor",name:"",phone:""};
async function C_startClient(){const L=await C_sb.from("client_links").select("*").eq("client_user",C_uid);C_links=L.data||[];
if(!C_links.length){C_msg("Abhi koi vendor jura nahi","Apne vendor ke WhatsApp invite link se aayein.",true);return}
C_vend=C_links[0];C_noKV=true;await C_loadClient();KV.m["alupro_vendor_c1"]=JSON.stringify(C_vinfo);C_inject();CLOUDSTART()}
async function C_loadClient(){const v=C_vend.vendor_id,m=await C_sb.from("client_mirror").select("*").eq("client_user",C_uid).eq("vendor_id",v).maybeSingle(),p=await C_sb.from("vendor_products").select("products").eq("vendor_id",v).maybeSingle(),a=await C_sb.from("client_actions").select("*").eq("client_user",C_uid).eq("vendor_id",v).eq("processed",false);
C_mirRow=m.data||{orders:[],credit:0,vendor:null};C_vprods=(p.data&&p.data.products)||[];C_acts=(a.data||[]).slice().sort((x,y)=>x.id-y.id);C_vinfo=C_mirRow.vendor||{shop:C_vend.vshop||"Vendor",name:"",phone:""}}
function C_rebuild(){const base=JSON.parse(JSON.stringify(C_mirRow.orders||[]));
C_acts.forEach(a=>{const o=base.find(x=>String(x.id)===String(a.ref));if(a.kind==="approve"&&o&&o.stage===1){o.stage=2;o.log=(o.log||[]).concat([{d:"",t:"Aap ne approve kiya (vendor confirm karega)"}])}else if(a.kind==="change"&&o){o.change=(a.payload||{}).text||""}else if(a.kind==="new_request"){const p=a.payload||{};base.push({id:-a.id,client:C_vend.name,phone:C_vend.phone,stage:0,advance:0,discount:0,items:[],reqItems:p.items||[],note:p.note||"",date:String(a.created_at||"").slice(0,10),log:[{d:"",t:"Request bheji gayi, vendor dekhega"}]})}});
orders=base;clients=[{id:"c1",name:C_vend.name,phone:C_vend.phone,credit:Number(C_mirRow.credit)||0}];PRODS=C_vprods.map(p=>({id:p.id,name:p.name,variants:(p.variants||[]).map(v=>({...v,lines:[],labour:0,other:0}))}))}
async function C_actSend(kind,ref,payload){const r=await C_sb.from("client_actions").insert({vendor_id:C_vend.vendor_id,client_user:C_uid,kind,ref:String(ref||""),payload});if(r.error){C_toast("⚠ "+r.error.message);return}await C_loadClient();C_rebuild();window._pm="Vendor ko bhej diya gaya.";render()}
async function C_clientReload(){const old=JSON.stringify(C_mirRow.orders);await C_loadClient();V=C_vinfo;document.getElementById("ttl").textContent=V.shop;C_rebuild();if(old!==JSON.stringify(C_mirRow.orders))C_toast("🔔 Vendor ne aap ke order mein update kiya");C_soft()}
function C_selVendor(i){C_vend=C_links[i];C_loadClient().then(()=>{C_rebuild();C_loadPord(true).then(()=>{demoRole("client")})})}
let C_defer=false,C_rsnap={},C_rknown=new Set(),C_psnap={},C_pknown=new Set(),C_mt;

<script type="text/plain" id="appsrc">

if(!RATES.alu)RATES.alu=JSON.parse(JSON.stringify(DEFR.alu));if(!RATES.fin)RATES.fin=JSON.parse(JSON.stringify(DEFR.fin));

function calc(i,rt){rt=rt||RATES;const a=i.w*i.h,b=Math.max(a,16),go=i.cat==="Glass Only";
 const glass=b*(rt.glass[i.glass]||0),frame=go?0:b*((rt.alu&&rt.alu[i.alu]!==undefined?rt.alu[i.alu]:rt.r.frame)+((rt.fin&&rt.fin[i.fin])||0)),lab=go?0:b*rt.r.labour,ins=i.inst?b*rt.r.install:0,hw=(i.hw||[]).reduce((s,k)=>s+(rt.hw[k]||0),0);
 return{b,glass:glass*i.q,frame:frame*i.q,lab:lab*i.q,ins:ins*i.q,hw:hw*i.q,t:(glass+frame+lab+ins+hw)*i.q}}

(function(){let t=null;try{t=KV.getItem("alutheme")}catch(e){}
 setTheme(t||(matchMedia("(prefers-color-scheme: dark)").matches?"ocean":"clean"))})();
function nav(){const t=[["home","🏠","Home"],["orders","📋","Orders"],["quote","✏️","New Quote"],["rates","💰","Rates"]];

function card(o){const gl=o.items.every(i=>i.cat==="Glass Only"),T=tot(o),bal=T-o.advance-o.discount,isOpen=open===o.id;
 return`<div class="card"><div class="row" onclick="tg(${o.id})" style="cursor:pointer"><div><b>${o.client}</b><div class="muted">#${o.id} · ${o.items.length} item(s) · ${o.phone}</div></div><span class="pill">${gl&&o.stage==6?"Delivered":STAGES[o.stage]}</span></div>
 <div class="steps">${STAGES.map((s,k)=>`<i class="${k<=o.stage?"on":""}"></i>`).join("")}</div>
 <div class="row"><span class="muted">Total</span><b>${rs(T)}</b></div>
 ${isOpen?`<div class="fade"><div class="line"><span>Advance received</span><span>${rs(o.advance)}</span></div>
 <div class="g2"><div><label>Add advance (Rs)</label><input id="adv${o.id}" type="number" min="0" placeholder="0"></div><div><label>Discount (Rs)</label><input id="dis${o.id}" type="number" min="0" value="${o.discount||""}" placeholder="0" onchange="sd(${o.id},this.value)"></div></div>

function renderV(){nav();const v=document.getElementById("view");v.classList.remove("fade");void v.offsetWidth;v.classList.add("fade");
